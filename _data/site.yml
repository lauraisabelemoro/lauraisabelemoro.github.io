  frase: "Toda história merece um jeito de ser contada."
  texto: "Para mim, criar conteúdo é uma forma de criar memórias. É registrar momentos, transformar experiências em histórias e encontrar maneiras de mostrar ao mundo quem somos, o que fazemos e o que temos para contar."
  pilulas:
    - "Estratégia de Conteúdo"
    - "Criação de Conteúdo"
    - "Creator Mobile"

